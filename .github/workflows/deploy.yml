name: Desplegar en AWS
 
on:
  push:
    branches: [main]
  workflow_dispatch:
 
concurrency:
  group: deploy
  cancel-in-progress: false
 
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
 
      - name: Preparar conexion SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          printf 'Host vm\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/key\n  StrictHostKeyChecking accept-new\n' \
            "$EC2_HOST" "$EC2_USER" > ~/.ssh/config
 
      - name: Copiar el codigo a la VM
        run: |
          rsync -az --delete \
            --exclude='.git' --exclude='.github' --exclude='docs' \
            --exclude='node_modules' --exclude='.env*' --exclude='data' \
            ./ vm:sistec/
 
      - name: Construir y levantar
        run: |
          ssh vm "cd sistec && docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build && docker image prune -f"
 
      - name: Comprobar que la API responde
        run: |
          ssh vm 'for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost/api/openapi.json && echo "API OK" && exit 0; sleep 5; done; echo "La API no respondio"; docker logs --tail 50 sistec_backend; exit 1'
