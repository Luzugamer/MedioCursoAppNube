name: sistec
 
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"
 
services:
  postgres:
    image: postgres:16-alpine
    container_name: sistec_postgres
    restart: unless-stopped
    shm_size: 512mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c max_connections=150
      -c shared_buffers=2GB
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/02-pg-stat-statements.sql:/docker-entrypoint-initdb.d/02-pg-stat-statements.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging
 
  backend:
    build: ./backend
    container_name: sistec_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      CORS_ORIGINS: ${CORS_ORIGINS}
    expose:
      - "8000"
    volumes:
      - ./data/uploads:/app/static/uploads
    logging: *logging
 
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: sistec_web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    logging: *logging
 
volumes:
  postgres_data:
