server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;

    # Re-resuelve el backend si se reinicia
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8000;

    location /api/    { proxy_pass $backend; proxy_set_header Host $host; proxy_read_timeout 120s; }
    location /static/ { proxy_pass $backend; proxy_set_header Host $host; }

    # Rutas de React (incluye /captura-movil/...)
    location / { try_files $uri /index.html; }
}